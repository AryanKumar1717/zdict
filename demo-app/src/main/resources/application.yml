server:
  compression:
    enabled: true
    mime-types: application/json
    min-response-size: 256

zdict:
  enabled: true
  dictionary-path: dictionary/products.dict
  paths:
    - /api/products
  allow-authenticated: false
  skip-reflected-input: true

management:
  endpoints:
    web:
      exposure:
        include: "*"
